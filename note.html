<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Note — StudyNotes</title>
  <meta name="description" content="A study note.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body id="noteRoot">
  <div class="progress-top" aria-hidden="true"><i id="progressTop"></i></div>

  <!-- ============================================================ sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <a class="brand" href="index.html"><span class="brand-mark">📚</span><span>StudyNotes</span></a>
      <button class="icon-btn sidebar-close" id="closeSidebar" aria-label="Close menu">✕</button>
    </div>
    <nav class="side-nav" id="sideNav" aria-label="Subjects"></nav>
    <div class="sidebar-foot">
      <div class="progress-mini">
        <div class="progress-mini-bar" id="progressMiniBar" aria-hidden="true"></div>
        <span id="progressMiniText">Loading…</span>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim" aria-hidden="true"></div>

  <!-- ============================================================ main -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn burger" id="openSidebar" aria-label="Open menu">☰</button>
      <div class="topbar-search" role="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" placeholder="Search notes… ( / )" aria-label="Search notes">
      </div>
      <span class="crumb" id="noteCrumbTop"></span>
      <div class="topbar-spacer"></div>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">🌙</button>
      <button class="icon-btn" id="searchBtn" aria-label="Open search">🔍</button>
    </header>

    <main class="content">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a>
        <span>·</span>
        <span id="noteSubjectLink"></span>
        <span>·</span>
        <span id="noteCrumbTitle"></span>
      </nav>

      <header class="note-head">
        <h1 class="note-title" id="noteTitle"></h1>
        <div class="note-meta">
          <span id="noteTag" class="tag">—</span>
          <span id="noteUnit"></span>
          <span>·</span>
          <span id="noteDate"></span>
          <span>·</span>
          <span id="noteReading"></span>
          <span>·</span>
          <span>👁 <span id="noteViews">0</span> views</span>
        </div>
        <p class="section-sub" id="noteMetaDesc" style="margin-bottom:.9rem"></p>

        <div class="note-actions">
          <button class="btn" id="markBtn" type="button">⭐ Bookmark</button>
          <button class="btn" id="doneBtn" type="button">✓ Mark complete</button>
          <button class="btn" id="dlHtml" type="button">⬇ Save HTML</button>
          <button class="btn" id="dlMd" type="button">⬇ Save Markdown</button>
          <button class="btn" id="printBtn" type="button">🖨 Print / PDF</button>
          <button class="btn" id="copyLink" type="button">🔗 Copy link</button>
        </div>
      </header>

      <div class="note-layout">
        <article class="note-body" id="noteBody"><p>Loading…</p></article>
        <aside class="toc-col" id="tocCol" aria-label="Table of contents">
          <nav class="toc-card">
            <h4>On this page</h4>
            <ul class="toc-list" id="tocList"></ul>
          </nav>
        </aside>
      </div>

      <nav class="note-pager" aria-label="Note navigation">
        <a class="pager-link" id="prevNote" href="#">
          <span class="dir">← Previous</span>
          <div class="pg-title"></div>
        </a>
        <a class="pager-link right" id="nextNote" href="#">
          <span class="dir">Next →</span>
          <div class="pg-title"></div>
        </a>
      </nav>

      <section class="section" aria-label="Related notes">
        <div class="section-head"><h2>More in this subject</h2></div>
        <div class="note-grid" id="relatedGrid"></div>
      </section>
    </main>

    <footer class="footer">
      <span>StudyNotes — DS · OOP · COA · IT · OB · Math</span>
      <span>Tip: press / to search · Ctrl+P to print</span>
    </footer>
  </div>

  <!-- ============================================================ search overlay -->
  <div class="overlay" id="searchOverlay" role="dialog" aria-label="Search notes">
    <div class="search-panel">
      <div class="sp-head">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-3)"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" type="search" placeholder="Search titles, tags, descriptions…" autocomplete="off">
        <button class="btn" style="padding:6px 12px" onclick="document.getElementById('searchOverlay').classList.remove('open')">Esc</button>
      </div>
      <div class="sp-results" id="searchResults"></div>
      <div class="sp-foot"><span>↑↓ navigate</span><span>↵ open</span><span>/ or Ctrl+K to search</span></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="assets/js/vendor/sql-wasm.js"></script>
  <script src="assets/js/notes-data.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
